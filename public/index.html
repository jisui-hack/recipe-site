<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自炊の本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<!-- ホーム画面に追加できるようにする。
     iOS は「サイトを7日間開かないと localStorage を消す」が、
     ホーム画面から開くアプリはその対象外になる。
     トークンを入れ直さずに済ませるための対策。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本棚">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="材料から探せる、1食15分の自炊レシピ帳。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="自炊の本棚">
<meta property="og:title" content="自炊の本棚">
<meta property="og:description" content="材料から探せる、1食15分の自炊レシピ帳。">
<meta property="og:url" content="https://jisui-hack.github.io/recipe-site/">
<meta property="og:image" content="https://jisui-hack.github.io/recipe-site/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@jisui_hack">
<meta name="theme-color" content="#2c6e4f">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <p class="site-title"><a href="index.html">自炊の本棚</a></p>
    <nav class="site-nav">
      <a class="nav-btn is-current" href="index.html" aria-current="page">レシピ一覧</a>
      <a class="nav-btn" href="search.html">材料から探す</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <label class="search">
    <span class="visually-hidden">タイトル・材料で検索</span>
    <input type="search" id="search" placeholder="タイトル・材料で検索（例：なす）" autocomplete="off">
  </label>

  <div class="controls">
    <div class="modes" role="radiogroup" aria-label="並び順">
      <label><input type="radio" name="sort" value="new" checked> 新着順</label>
      <label><input type="radio" name="sort" value="time"> 時間が短い順</label>
    </div>
  </div>

  <h2 id="list-heading">レシピ一覧</h2>
  <p id="status" class="status">読み込み中…</p>
  <ul id="card-list" class="card-list"></ul>
</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
